name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 2026-08-28: one package, one install. The nested studio/ package was
      # folded into the root with the Sanity 6.4 upgrade, so there is no second
      # node_modules tree to install (and, crucially, no second copy of
      # styled-components / @sanity/ui to break the Studio's theme context).
      - name: Install dependencies
        run: npm ci

      - name: Generate Sanity types
        run: npm run typegen

      - name: Fail if committed Sanity types are stale
        # Added 2026-08-27 (ported from ncs-astro-sanity-starter; PORTS.md card 5).
        # `npm run build` does NOT chain typegen, so src/lib/sanity.types.ts is
        # committed by hand after every schema change -- and sooner or later it
        # is not. presacademy shipped types describing a schema that no longer
        # existed, on a green build, on 2026-06-14. Regeneration already ran in
        # the step above; if it produced a diff, the commit was stale.
        #
        # Verified byte-stable in this repo 2026-08-27: `npm run typegen`
        # reproduces the committed file exactly (the only local difference is
        # CRLF, which git normalizes, so the check is clean on Linux CI).
        run: |
          if ! git diff --quiet -- src/lib/sanity.types.ts; then
            echo "::error::src/lib/sanity.types.ts is out of date. Run 'npm run typegen' and commit the result."
            git --no-pager diff -- src/lib/sanity.types.ts
            exit 1
          fi

      - name: Build Astro
        # PUBLIC_SANITY_PROJECT_ID is intentionally left unset (or set to the
        # placeholder string). sanityFetch() detects this and returns empty-state
        # fallbacks for every query, so the build completes without any Sanity
        # project configured and no credentials are required.
        env:
          PUBLIC_SANITY_PROJECT_ID: ""
        run: npm run build

      # The Studio is no longer built separately: `astro build` above builds it
      # as part of the site (@sanity/astro mounts it at /studio). A standalone
      # `sanity build` would write to ./dist and clobber the Astro output.

      - name: Run tests
        run: npm test
